<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kobocent film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=block">
<style>
  /* Kobocent brand (src/pnl/brand.js): terracotta #C1502E, ink #20211F, cream #F7F3EE, warm cream #F0E6D8, border #E4D8C6 */
  :root { --terra:#C1502E; --terra-dark:#9A3E22; --terra-light:#E8895F; --ink:#20211F; --cream:#F7F3EE; --warm:#F0E6D8; --border:#E4D8C6; --muted:#6B5D52; --ok:#58834C; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cream); }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); position: relative; -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .display { font-family: 'Fraunces', Georgia, serif; font-weight: 700; letter-spacing: -0.02em; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }

  /* Stage */
  #bg { inset: 0; background: radial-gradient(1200px 900px at 50% 18%, #FBF6EF 0%, #F7F3EE 45%, #F0E6D8 100%); }
  .ring { border-radius: 50%; border: 70px solid var(--terra); opacity: .07; }
  .dot { border-radius: 50%; background: var(--terra); opacity: .07; }

  #hook { inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 90px; gap: 34px; }
  #hook .l1 { font-size: 150px; line-height: 1.02; color: var(--ink); }
  #hook .l2 { font-size: 92px; line-height: 1.08; color: var(--terra); font-style: italic; }
  #hook .tag { font-size: 30px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

  #caps { left: 60px; right: 60px; top: 70px; height: 250px; }
  .cap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 16px; }
  .cap .step { font-size: 26px; letter-spacing: .3em; color: var(--terra); font-weight: 600; text-transform: uppercase; }
  .cap .txt { font-size: 70px; line-height: 1.08; }
  .cap .txt em { color: var(--terra); }

  #phone { left: 190px; top: 338px; width: 700px; height: 1482px; border-radius: 96px; background: #161614; padding: 14px;
    box-shadow: 0 60px 120px rgba(32,33,31,.28), 0 18px 40px rgba(32,33,31,.18), inset 0 0 0 2px #3a3a36; }
  #glass { position: relative; width: 672px; height: 1454px; border-radius: 84px; overflow: hidden; background: var(--cream); }
  #screen { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; transform: scale(1.7231); }
  #island { position: absolute; left: 50%; top: 20px; width: 190px; height: 54px; margin-left: -95px; border-radius: 30px; background: #0c0c0b; z-index: 50; }
  #foot { left: 0; right: 0; top: 1838px; text-align: center; font-size: 30px; color: var(--muted); font-weight: 500; letter-spacing: .02em; }
  #bar { left: 0; bottom: 0; height: 8px; background: var(--terra); width: 0; }

  /* App UI (390 × 844 design space) */
  .scr { position: absolute; inset: 0; background: var(--cream); padding: 58px 0 0; font-size: 15px; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 14px 30px 0; font-weight: 600; font-size: 15px; z-index: 5; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 12px; border-bottom: 1px solid var(--border); }
  .lock { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; }
  .icons { display: flex; gap: 10px; align-items: center; color: var(--ink); }
  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--terra); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .pad { padding: 18px 18px 0; }
  .hello { font-size: 14px; color: var(--muted); }
  .name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 29px; letter-spacing: -.02em; margin-top: 2px; }
  .bal { margin-top: 18px; border-radius: 26px; background: var(--terra); color: #fff; padding: 22px 20px 20px; position: relative; overflow: hidden; }
  .bal .lbl { font-size: 13.5px; opacity: .85; }
  .bal .amt { font-family: 'Fraunces', serif; font-weight: 700; font-size: 44px; letter-spacing: -.02em; margin-top: 6px; }
  .bal .sub { font-size: 13px; opacity: .85; margin-top: 4px; }
  .bal .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .bal .b1 { background: #fff; color: var(--terra); border-radius: 14px; height: 44px; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .bal .b2 { background: rgba(255,255,255,.18); color: #fff; border-radius: 14px; height: 44px; display: grid; place-items: center; font-weight: 600; font-size: 15px; }
  .bal .r1 { position: absolute; right: 44px; top: 6px; width: 120px; height: 120px; border-radius: 50%; border: 14px solid rgba(255,255,255,.14); }
  .bal .r2 { position: absolute; right: -26px; top: 36px; width: 78px; height: 78px; border-radius: 50%; background: rgba(255,255,255,.14); }
  .h { font-family: 'Fraunces', serif; font-weight: 700; font-size: 19px; margin-top: 24px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 6px; margin-top: 16px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; text-align: center; line-height: 1.2; }
  .act .ic { width: 46px; height: 46px; border-radius: 15px; border: 1.5px solid #E7C9BC; display: grid; place-items: center; color: var(--terra); background: #FBF6F1; }
  .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #fff; border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding: 10px 6px 0; font-size: 10.5px; color: var(--muted); text-align: center; }
  .tabs div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tabs .on { color: var(--terra); font-weight: 600; }

  .ph { display: flex; align-items: center; gap: 12px; padding: 6px 18px 0; }
  .ph .back { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border); display: grid; place-items: center; background: #fff; }
  .ph .t { font-family: 'Fraunces', serif; font-weight: 700; font-size: 24px; letter-spacing: -.01em; }
  .sub2 { color: var(--muted); font-size: 13.5px; line-height: 1.4; padding: 8px 18px 0; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 16px 18px 0; background: var(--warm); padding: 5px; border-radius: 14px; font-size: 12.5px; font-weight: 600; text-align: center; color: var(--muted); }
  .seg div { padding: 9px 0; border-radius: 10px; }
  .seg .on { background: #fff; color: var(--terra); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 14px 16px; }
  .field { margin: 14px 18px 0; }
  .input { margin-top: 8px; height: 52px; border-radius: 14px; border: 1.5px solid var(--border); background: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 17px; font-weight: 500; }
  .input.focus { border-color: var(--terra); box-shadow: 0 0 0 4px rgba(193,80,46,.10); }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--terra); margin-left: 2px; }
  .chips { display: flex; gap: 8px; margin-top: 8px; }
  .chip { flex: 1; height: 44px; border-radius: 13px; border: 1.5px solid var(--border); background: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14.5px; }
  .chip.on { border-color: var(--terra); background: rgba(193,80,46,.08); color: var(--terra); }
  .ok { color: var(--ok); font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .dark { margin: 14px 18px 0; background: var(--ink); color: var(--cream); border-radius: 20px; padding: 16px 18px; }
  .dark .big { font-family: 'Fraunces', serif; font-weight: 700; font-size: 30px; margin-top: 2px; }
  .dark dl { display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; font-size: 13px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(247,243,238,.14); }
  .dark dt { color: rgba(247,243,238,.7); }
  .dark dd { text-align: right; }
  .cta { position: absolute; left: 18px; right: 18px; bottom: 34px; height: 56px; border-radius: 18px; background: var(--terra); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; box-shadow: 0 8px 20px rgba(193,80,46,.28); }

  .dim { position: absolute; inset: 0; background: rgba(32,33,31,.45); z-index: 20; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cream); border-radius: 28px 28px 0 0; padding: 12px 20px 34px; z-index: 21; }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 14px; }
  .sheet .t { font-family: 'Fraunces', serif; font-weight: 700; font-size: 23px; }
  .rows { display: grid; grid-template-columns: auto 1fr; gap: 11px 14px; font-size: 14.5px; margin-top: 16px; }
  .rows dt { color: var(--muted); }
  .rows dd { text-align: right; font-weight: 500; }
  .line { height: 1px; background: var(--border); margin: 16px 0 0; }
  .hold { position: relative; margin-top: 20px; height: 58px; border-radius: 18px; background: var(--terra); color: #fff; overflow: hidden; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
  .hold .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--terra-dark); }
  .hold span { position: relative; }
  .hint { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 10px; }

  .done { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 120px 26px 0; }
  .tick { width: 92px; height: 92px; border-radius: 50%; background: rgba(88,131,76,.14); display: grid; place-items: center; }
  .done .t { font-family: 'Fraunces', serif; font-weight: 700; font-size: 29px; line-height: 1.15; margin-top: 22px; letter-spacing: -.01em; }
  .done .b { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin-top: 10px; }
  .token { margin-top: 22px; width: 100%; background: #fff; border: 1.5px dashed var(--terra); border-radius: 18px; padding: 16px; }
  .token .n { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 19px; letter-spacing: .04em; margin-top: 8px; color: var(--ink); }
  .pill { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; background: rgba(88,131,76,.14); color: var(--ok); font-weight: 700; font-size: 14.5px; padding: 10px 16px; border-radius: 999px; }
  .more { display: flex; gap: 8px; margin-top: 18px; width: 100%; }
  .more div { flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 0; font-size: 12.5px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink); }
  .more .ic2 { color: var(--terra); }

  .notif { position: absolute; left: 10px; right: 10px; top: 58px; background: rgba(255,255,255,.96); border-radius: 22px; padding: 14px 16px; z-index: 40; box-shadow: 0 14px 34px rgba(0,0,0,.18); display: flex; gap: 12px; align-items: center; }
  .notif .app { width: 40px; height: 40px; border-radius: 11px; background: var(--ink); display: grid; place-items: center; color: #fff; font-weight: 700; }
  .notif .tt { font-weight: 700; font-size: 14px; }
  .notif .bb { font-size: 13.5px; color: #3a3a36; margin-top: 2px; }

  /* Kobo Pal chat */
  .chat { position: absolute; inset: 0; background: var(--cream); display: flex; flex-direction: column; padding-top: 58px; }
  .chd { display: flex; align-items: center; gap: 12px; padding: 8px 18px 14px; border-bottom: 1px solid var(--border); }
  .pal { width: 42px; height: 42px; border-radius: 50%; background: var(--terra); display: grid; place-items: center; color: #fff; }
  .chd .n { font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; }
  .chd .s { font-size: 12.5px; color: var(--ok); font-weight: 600; }
  .msgs { flex: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 14px 14px 12px; }
  .m { max-width: 88%; font-size: 15px; line-height: 1.45; padding: 11px 15px; border-radius: 20px; }
  .m.u { align-self: flex-end; background: var(--terra); color: #fff; border-bottom-right-radius: 6px; }
  .m.p { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .m.p b { font-weight: 700; }
  .btn { align-self: flex-start; margin-top: -2px; background: rgba(193,80,46,.09); color: var(--terra); border: 1.5px solid rgba(193,80,46,.35); font-weight: 700; font-size: 14px; padding: 11px 16px; border-radius: 15px; }
  .btn.on { background: var(--terra); color: #fff; }
  .dots { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-radius: 20px; border-bottom-left-radius: 6px; padding: 14px 16px; display: flex; gap: 5px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: block; }
  .comp { margin: 0 12px 30px; height: 54px; border-radius: 27px; background: #fff; border: 1.5px solid var(--border); display: flex; align-items: center; padding: 0 8px 0 18px; font-size: 15px; gap: 8px; }
  .comp .tx { flex: 1; white-space: nowrap; overflow: hidden; }
  .comp .ph2 { color: #a39686; }
  .send { width: 40px; height: 40px; border-radius: 50%; background: var(--terra); display: grid; place-items: center; color: #fff; }

  #tap { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(32,33,31,.20); border: 2.5px solid rgba(255,255,255,.9); z-index: 60; opacity: 0; box-shadow: 0 4px 14px rgba(0,0,0,.18); }

  /* End card */
  #end { inset: 0; overflow: hidden; }
  #wipe { position: absolute; left: 540px; top: 1040px; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--terra); }
  #endin { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 0 80px; }
  #endin .w { font-family: 'Fraunces', serif; font-weight: 700; font-size: 150px; letter-spacing: -.03em; margin-top: 30px; }
  #endin .tg { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 58px; line-height: 1.15; margin-top: 26px; color: #FBE9DF; }
  #endin .cta2 { margin-top: 90px; background: #fff; color: var(--terra); font-weight: 700; font-size: 46px; padding: 30px 56px; border-radius: 999px; box-shadow: 0 20px 50px rgba(0,0,0,.18); }
  #endin .m2 { margin-top: 70px; font-size: 32px; letter-spacing: .04em; color: #FBE9DF; font-weight: 500; }
  #fine { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: 24px; color: rgba(255,255,255,.72); }

  /* films 4–6 */
  .tog { width: 52px; height: 30px; border-radius: 999px; background: var(--border); position: relative; flex: none; }
  .tog i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); display: block; }
  .tog.on { background: var(--terra); } .tog.on i { left: 25px; }
  .tkn { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #E8895F, #9A3E22); color: #fff; display: grid; place-items: center; font-family: 'Fraunces', serif; font-weight: 700; font-size: 19px; flex: none; }
  .gauge { position: relative; width: 78px; height: 78px; flex: none; }
  .gauge .gn { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .gauge .gn b { font-family: 'Fraunces', serif; font-size: 25px; } .gauge .gn span { font-size: 9.5px; color: var(--muted); margin-top: 2px; }
  .sig { list-style: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: grid; gap: 9px; font-size: 14px; }
  .sig li { display: flex; gap: 9px; align-items: center; } .sig li::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .prow b { display: block; font-size: 15px; } .prow span { font-size: 13px; color: var(--muted); }
  .hero { margin: 14px 18px 0; border-radius: 24px; background: var(--terra); color: #fff; padding: 20px; position: relative; overflow: hidden; }
  .hero .r1 { position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 50%; border: 16px solid rgba(255,255,255,.14); }
  .plan { margin: 12px 18px 0; background: #fff; border: 1.5px solid var(--border); border-radius: 20px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .plan b { display: block; font-size: 16px; } .plan span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; } .plan em { display: block; font-style: normal; font-size: 12.5px; color: var(--ink); margin-top: 8px; }
  .plan .rt { text-align: right; } .plan .rt b { font-family: 'Fraunces', serif; font-size: 30px; color: var(--terra); line-height: 1; } .plan .rt span { font-size: 11.5px; }
  .daychip { background: rgba(193,80,46,.1); color: var(--terra); font-weight: 700; font-size: 13px; padding: 7px 12px; border-radius: 999px; font-family: 'IBM Plex Mono', monospace; }
  .barw { height: 8px; border-radius: 4px; background: var(--warm); margin-top: 16px; overflow: hidden; } .barw i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 4px; }
  .wd { margin-top: 14px; height: 54px; border-radius: 17px; border: 1.5px solid var(--terra); color: var(--terra); display: grid; place-items: center; font-weight: 700; font-size: 15.5px; background: #fff; }
  .wd.on { background: var(--terra); color: #fff; }
  .lrow { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; margin-top: 8px; }
  .lrow .lic { width: 38px; height: 38px; border-radius: 12px; background: rgba(193,80,46,.09); color: var(--terra); display: grid; place-items: center; flex: none; }
  .lrow b { display: block; font-size: 14.5px; } .lrow span { font-size: 12.5px; color: var(--muted); }
  .lrow .plus { color: var(--ok); font-weight: 700; font-size: 14.5px; background: rgba(88,131,76,.12); padding: 6px 10px; border-radius: 999px; }
  .cbt { margin-top: 16px; border: 1.5px solid var(--border); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; background: #fff; }
  .cbt.on { border-color: var(--terra); background: rgba(193,80,46,.05); }
  .cbt .gift { width: 40px; height: 40px; border-radius: 13px; background: var(--warm); color: var(--terra); display: grid; place-items: center; flex: none; }
  .cbt.on .gift { background: var(--terra); color: #fff; }
  .cbt b { display: block; font-size: 15px; } .cbt span { font-size: 13px; color: var(--muted); line-height: 1.35; display: block; margin-top: 2px; }


  /* film 4 rebuilt + films 7–9 */
  .sa { position: absolute; left: 0; right: 0; top: 106px; bottom: 0; overflow: hidden; }
  #pg { position: relative; padding: 0 18px 60px; }
  .lb4 { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
  .cg { display: grid; gap: 6px; margin-top: 8px; }
  .chip2 { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--border); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; font-size: 13.5px; text-align: center; padding: 4px 2px; line-height: 1.15; }
  .chip2 small { font-size: 10px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .chip2.on { border-color: var(--terra); background: rgba(193,80,46,.08); color: var(--terra); }
  .amtbox { margin-top: 14px; border: 1.5px solid var(--border); border-radius: 16px; padding: 6px 14px; display: flex; align-items: baseline; gap: 4px; min-height: 60px; }
  .amtbox.focus { border-color: var(--terra); box-shadow: 0 0 0 4px rgba(193,80,46,.10); }
  .pbtn { margin-top: 14px; min-height: 52px; border-radius: 16px; background: var(--terra); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15.5px; }
  .gbtn { margin-top: 8px; min-height: 46px; border-radius: 16px; border: 1.5px solid var(--border); display: grid; place-items: center; font-weight: 600; font-size: 14.5px; background: #fff; }
  .sug { margin-top: 14px; border: 1.5px solid rgba(193,80,46,.3); background: rgba(193,80,46,.04); border-radius: 16px; padding: 14px; display: grid; gap: 8px; }
  .sug p { font-size: 12px; color: var(--muted); line-height: 1.5; }
